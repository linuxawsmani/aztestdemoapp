version: 0.2

phases:
  pre_build:
    commands:
    - pwd
    - ls -la
    - find . -maxdepth 2 -type f
    - echo Logging in to Amazon ECR...
    - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 604275787869.dkr.ecr.us-east-1.amazonaws.com
    - REPOSITORY_URI=604275787869.dkr.ecr.us-east-1.amazonaws.com/aztestdemoapp
    - IMAGE_TAG=latest

  build:
    commands:
    - echo Build started on `date`
    - echo Building the Docker image...
    - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
    - echo Build completed on `date`
    - echo Pushing the Docker image...
    - docker push $REPOSITORY_URI:$IMAGE_TAG
    - printf '[{"name":"aztestdemoapp","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
  - imagedefinitions.json
